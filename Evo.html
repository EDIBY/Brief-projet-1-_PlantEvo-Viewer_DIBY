<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Brief projet plantEvo -DIBY Ebenezer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- création de la zone de l'entête -->
    <header class="entete">
        <!-- Entête des 7 pages -->
        <!-- Ajout des images, des icones et des formes de l'entête -->
        <a class="logo">
            <img src="images_acceuille/Union.svg" alt="logo" width="50" height="50">
            <span>PlantEvo</span>
        </a>

        <!-- Menu principal -->
        <nav class="navigation">

            <!-- Icone home renvoie à la page d'acceuil -->
            <a class="acceuil" href="Evo.html">
                <img src="images_acceuille/Homeicone.png" alt="icone acceuil" width="72" height="72">
            </a>

            <!-- Menu reproduction-->
            <div class="menu">
                <!-- button pour faire une liste deroulante au clique de l'icone fleur-->
                <button class="icone" type="button">
                    <img src="images_acceuille/bouquet-lys-roses-fleurs-elegantes-fleurs-printemps_632498-55738 4.png"
                        alt="icone reproduction(fleur)" width="" height="">
                </button>

                <div class="sous-menu">
                    <a href="algues.html#reproduction"></a>
                    <a href="mousses.html#reproduction"></a>
                    <a href="fougeres.html#reproduction"></a>
                    <a href="gymnospermes.html#reproduction"></a>
                    <a href="graminees.html#reproduction"></a>
                    <a href="dicotyledones.html#reproduction"></a>
                </div>
            </div>

            <!-- Menu appareil vegetatif -->
            <div class="menu">
                <button class="icone" type="button">
                    <img src="images_acceuille/pngtree-coca-leaf-isolated-on-transparent-background-png-image_16771359 4.svg"
                        alt="icone appareil vegetatif(feuille)" width="" height="">
                </button>
                <div class="sous-menu">
                    <a href="algues.html#vegetatif"></a>
                    <a href="mousses.html#vegetatif"></a>
                    <a href="fougeres.html#vegetatif"></a>
                    <a href="gymnospermes.html#vegetatif"></a>
                    <a href="graminees.html#vegetatif"></a>
                    <a href="dicotyledones.html#vegetatif"></a>
                </div>

            </div>

            <!-- Menu Observation et collecte sur terrain-->
            <div class="menu">
                <button class="icone" type="button">
                    <img src="images_acceuille/geolocalisation.png" alt="Icone géolocalisation" width="108" height="72">
                </button>

                <div class="sous-menu">
                    <a href="algues.html#observation"></a>
                    <a href="mousses.html#observation"></a>
                    <a href="fougeres.html#observation"></a>
                    <a href="gymnospermes.html#observation"></a>
                    <a href="graminees.html#observation"></a>
                    <a href="dicotyledones.html#observation"></a>
                </div>
            </div>

            <img src="images_acceuille/loupe-et-icone-de-recherche-de-couleur-verte 4.svg" alt="loupe de recherche"
                width="" height="">
        </nav>
    </header>

    <!-- Colonne principale-->
    <main>
        <!-- Ajout des images, du text, des icones et des formes de la colonne principale -->
        <!-- Ajout d'article pour rendre indépendant leselements implemente dans chaque article des elements des autres articles -->
        <article class="element">
            <h1>A la decouverte du monde végétale</h1>
            <h3>Comment les végétaux ont-ils conquis la terre ?</h3>
            <p>
                Allons à la découverte du monde végétal à travers une expérience illustrative et interactive.
            </p>
            <img src="images_acceuille/Bienfait.png" alt="Icone pour avoir accès au rôle des plantes" width="256"
                height="256">
        </article>

        <!-- Ajout d'article pour rendre indépendant leselements implemente dans chaque article des elements des autres articles -->

        <article class="element">
            <img src="images_acceuille/Algue_A.avif" alt="une algue verte" width="302" height="195">
            <img src="images_acceuille/Ellipse 1.svg" alt="" width="" height="">
            <img src="images_acceuille/Dicotylédone.jpg" alt="des fleurs" width="260" height="195">
        </article>

        <!-- Ajout d'article pour rendre indépendant leselements implemente dans chaque article des elements des autres articles -->

        <article class="element">
            <img src="images_acceuille/mousse.webp" alt="Une mousse" width="" height="195">
            <img src="images_acceuille/Fougère.webp" alt="Une fougère" width="" height="195">
            <img src="images_acceuille/Conifère.jpg" alt="Une conifère" width="" height="195">
            <img src="images_acceuille/Graminé.jpg" alt="Un graminé" width="" height="195">
        </article>


    </main>
    <!-- Pied de page -->
    <footer>
        <p>Plus de 350 000 espèces végétales décrites</p>
    </footer>
